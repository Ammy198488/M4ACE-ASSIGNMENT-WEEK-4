<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Form</title>
    <link rel="stylesheet" href="styles.css"> <!-- Link to external CSS -->
</head>
<body>

    <h2 class="heading">Contact Us</h2>

    <form action="submit.html" method="POST" class="contact-form">
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" class="input-field" required><br><br>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" class="input-field" required><br><br>

        <label for="message">Message:</label><br>
        <textarea id="message" name="message" rows="4" class="input-field" required></textarea><br><br>

        <button type="submit" id="submit-btn">Submit</button>
    </form>

    <br>
    <a href="about.html" class="nav-link">Go to About Page</a>

</body>
</html>
